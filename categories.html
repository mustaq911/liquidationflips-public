<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shop by Category — Liquidation Flips</title>
  <link href="/img/logo-small.jpg" rel="icon">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#fff;color:#16202e}
    .cat{--accent:#1f8b57}
    .cat section{max-width:1400px;margin:0 auto;padding:0 28px}
    .cat .hero{padding:56px 28px 8px}
    .cat .eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
    .cat .eyebrow span:first-child{width:24px;height:1px;background:var(--accent);display:inline-block}
    .cat .eyebrow span:last-child{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--accent)}
    .cat h1{font-weight:800;font-size:clamp(26px,3.2vw,38px);line-height:1.08;letter-spacing:-.02em;margin:0 0 12px}
    .cat .sub{font-size:15.5px;line-height:1.6;color:#6b7480;margin:0;max-width:620px}

    .cat-tools{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:26px 28px 6px}
    .cat-searchwrap{position:relative;flex:1;min-width:240px;max-width:460px}
    .cat-searchwrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%)}
    .cat-searchwrap input{width:100%;border:1px solid #dfe2e6;background:#fff;border-radius:10px;padding:12px 14px 12px 40px;font-family:inherit;font-size:14.5px;color:#16202e;outline:none}
    .cat-searchwrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,139,87,.12)}
    .cat-count{font-size:13.5px;color:#6b7480;font-weight:500}

    .cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding:18px 28px 56px;max-width:1400px;margin:0 auto}
    .cat-tile{display:flex;flex-direction:column;gap:12px;border:1px solid #e6e8ec;border-radius:14px;padding:20px;text-decoration:none;color:#16202e;background:#fff;transition:box-shadow .25s ease,border-color .25s ease,transform .25s ease}
    .cat-tile:hover{box-shadow:0 12px 32px -20px rgba(22,32,46,.4);border-color:#d6dade;transform:translateY(-2px)}
    .cat-ic{width:42px;height:42px;border-radius:11px;background:rgba(31,139,87,.1);color:var(--accent);display:flex;align-items:center;justify-content:center}
    .cat-name{font-weight:700;font-size:16px;line-height:1.3;color:#16202e}
    .cat-go{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--accent)}
    .cat-empty{grid-column:1/-1;padding:52px 8px;text-align:center;color:#97a0ab;font-size:14px;line-height:1.5}

    @media (max-width:640px){ .cat .hero{padding:40px 18px 8px} .cat-tools{padding:20px 18px 6px} .cat-grid{padding:16px 18px 40px} }
  </style>
</head>
<body>

  <!-- Shared Topnav (also injects the footer via auth.js) -->
  <link rel="stylesheet" href="/css/topnav.css">
  <div id="topnavContainer"></div>
  <script src="/js/config.js"></script>
  <script src="/js/auth.js?v=2" defer></script>

  <div class="cat">
    <section class="hero">
      <div class="eyebrow"><span></span><span>Browse</span></div>
      <h1>Shop by Category</h1>
      <p class="sub">Pick a category to jump straight into the inventory, filtered and ready. New lots land across every category regularly.</p>
    </section>

    <div class="cat-tools">
      <span class="cat-searchwrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9aa1ab" stroke-width="2.2"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
        <input id="catSearch" type="text" placeholder="Search categories…" aria-label="Search categories" />
      </span>
      <span class="cat-count" id="catCount">Loading…</span>
    </div>

    <div class="cat-grid" id="catGrid">
      <div class="cat-empty">Loading categories…</div>
    </div>
  </div>

  <!-- Category list is fetched live; each tile deep-links to the inventory page
       pre-filtered by that category (index.html reads ?category=<id>).
       CONFIG is a top-level const from /js/config.js (loaded above), so it's
       referenced directly here — it is NOT exposed as window.CONFIG. -->
  <script>
    (function () {
      var API = (typeof CONFIG !== 'undefined' && CONFIG.API_BASE_URL) || '';
      var grid = document.getElementById('catGrid');
      var countEl = document.getElementById('catCount');
      var searchEl = document.getElementById('catSearch');
      var ALL = [];

      function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

      var ICON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.6 13.4l-7.2 7.2a2 2 0 01-2.8 0l-7-7A2 2 0 013 12.2V5a2 2 0 012-2h7.2a2 2 0 011.4.6l7 7a2 2 0 010 2.8z"></path><circle cx="7.5" cy="7.5" r="1.4" fill="currentColor"></circle></svg>';
      var ARROW = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>';

      function render() {
        var q = (searchEl.value || '').trim().toLowerCase();
        if (!ALL.length) { grid.innerHTML = '<div class="cat-empty">No categories are available right now.</div>'; countEl.textContent = '0 categories'; return; }
        var rows = ALL.filter(function (c) { return !q || String(c.name || '').toLowerCase().indexOf(q) >= 0; });
        countEl.textContent = rows.length + (rows.length === 1 ? ' category' : ' categories');
        if (!rows.length) { grid.innerHTML = '<div class="cat-empty">No categories match “' + esc(searchEl.value.trim()) + '”.</div>'; return; }
        grid.innerHTML = rows.map(function (c) {
          return '<a class="cat-tile" href="/index.html?category=' + encodeURIComponent(c.id) + '">' +
            '<span class="cat-ic">' + ICON + '</span>' +
            '<span class="cat-name">' + esc(c.name) + '</span>' +
            '<span class="cat-go">View lots ' + ARROW + '</span>' +
          '</a>';
        }).join('');
      }

      searchEl.addEventListener('input', render);

      fetch(API + '/category/get/all')
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (data) {
          // Only show active categories with a usable id + name.
          ALL = (Array.isArray(data) ? data : []).filter(function (c) {
            return c && c.active !== false && c.id != null && c.name;
          });
          render();
        })
        .catch(function () { ALL = []; render(); });
    })();
  </script>

</body>
</html>
