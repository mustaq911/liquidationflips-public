<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Bids - Liquidation Flips</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root{
      --bg:#EAF0EC; --panel:#ffffff; --text:#111827; --muted:#6b7280;
      --brand:#1F8B57; --brand-2:#177045; --brand2:#177045; --border:#e5e7eb;
      --shadow:0 16px 40px rgba(15,23,42,0.07);
      --radius:16px;
      --chip:#0ea5e9;

      --green-bg:#ecfdf3; --green-b:#bbf7d0; --green-t:#166534;
      --red-bg:#fef2f2;   --red-b:#fecaca;   --red-t:#b91c1c;
      --orange-bg: rgba(251,146,60,.18); --orange-b: rgba(251,146,60,.45); --orange-t:#9a3412;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0; padding:0; background:var(--bg); color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    }
    a{text-decoration:none;color:inherit}

    .page{max-width:1400px;margin:0 auto;padding:24px 28px 40px;box-sizing:border-box;}
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

    /* Hero */
    .hero{
      display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;
      padding:16px 18px;border-radius:var(--radius);
      border:1px solid var(--border);
      background:#f5f8f6;
      margin-bottom:16px;
    }
    /* Phone: tighter page gutters, full-width search so nothing overflows */
    @media(max-width:640px){
      .page{padding:18px 16px 32px}
      .input{min-width:0;width:100%;flex:1 1 auto}
    }
    .heroIcon{
      width:44px;height:44px;border-radius:12px;
      display:grid;place-items:center;
      background:rgba(31,139,87,.12);
      border:1px solid rgba(31,139,87,.20);
      color:var(--brand);font-size:18px;flex:0 0 auto;
    }
    .heroHead{display:flex;align-items:center;gap:12px;margin-bottom:8px}
    .heroHead h1{margin:0}
    h1{font-size:22px;margin:0 0 6px;}
    .muted{color:var(--muted);font-size:13px;line-height:1.45}
    .chip{
      background:#fff;color:var(--text);border:1px solid var(--border);
      padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;
      display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
    }
    .chip i{color:var(--brand)}

    .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px;}
    .input{
      background:#fff;border:1px solid var(--border);border-radius:12px;
      padding:10px 12px;font-size:13px;outline:none;min-width:240px;
    }
    .input:focus{border-color:rgba(31,139,87,.45);box-shadow:0 0 0 4px rgba(31,139,87,.12);}

    .btn{
      display:inline-flex;align-items:center;gap:8px;
      padding:10px 12px;border-radius:12px;border:1px solid var(--border);
      background:#fff;cursor:pointer;font-weight:800;font-size:13px;white-space:nowrap;
    }
    .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
    .btn-primary:hover{background:var(--brand-2)}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    a.btn.btn-pay{background:#16a34a;border-color:#16a34a;color:#fff;margin-left:6px;}
    a.btn.btn-pay:hover{background:#15803d;border-color:#15803d;}
    .btn-sm{padding:6px 10px;font-size:12px;border-radius:10px;}

    /* KPIs */
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0;}
    @media(max-width:950px){.kpis{grid-template-columns:repeat(2,1fr)}}
    /* Phone: compact 2×2 KPI tiles instead of four full-width rows */
    @media(max-width:520px){
      .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
      .kpi{padding:12px}
      .kpi .val{font-size:16px}
      .kpi .hint{display:none}
    }
    .kpi{border-radius:var(--radius);padding:14px;border:1px solid var(--border);background:#fff;}
    .kpi .label{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
    .kpi .label i{color:var(--brand)}
    .kpi .val{font-size:18px;font-weight:900;margin-top:6px}
    .kpi .hint{font-size:12px;color:var(--muted);margin-top:4px}
    /* One neutral tile treatment — colour comes only from the green icon. */
    .kpi.blue,.kpi.green,.kpi.amber,.kpi.red{border:1px solid var(--border);background:#fff}

    /* Tabs */
    .tabs{
      background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
      box-shadow:var(--shadow);padding:12px;display:flex;gap:10px;flex-wrap:wrap;
      margin-bottom:12px;align-items:center;
    }
    .tabButtons{display:flex; gap:8px; flex-wrap:wrap}
    .tabBtn{
      border:1px solid var(--border);background:#fff;border-radius:999px;
      padding:9px 14px;font-weight:800;font-size:13px;cursor:pointer;
      display:inline-flex;align-items:center;gap:8px;
    }
    .tabBtn.active{background:var(--brand);border-color:var(--brand);color:#fff;}
    .tabCount{
      background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.35);
      padding:2px 8px;border-radius:999px;font-size:12px;font-weight:900;
    }
    .tabBtn:not(.active) .tabCount{background:#f1f5f9;border-color:var(--border);color:var(--muted)}

    /* Table shell */
    .panel{
      background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
      box-shadow:var(--shadow);overflow:auto;
    }
    table{width:100%;border-collapse:collapse;font-size:13px;min-width:1100px;}
    thead{background:#f9fafb}
    th,td{padding:11px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle;white-space:nowrap;}
    th{color:var(--muted);font-weight:900;font-size:11px;text-transform:uppercase;letter-spacing:.06em;}
    tbody tr.dataRow:hover{background:#fafafa}
    tbody tr.dataRow{cursor:pointer}

    .thumbCell{display:flex;align-items:center;gap:10px;min-width:340px;}
    .thumb{
      width:44px;height:44px;border-radius:12px;overflow:hidden;border:1px solid var(--border);
      background:#f1f3f6;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    }
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .lotText{min-width:0}
    .lotTitle{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px;}
    .lotMeta{margin-top:3px;color:var(--muted);font-weight:700;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px;}

    /* Pills */
    .pill{
      display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;
      font-weight:900;font-size:11px;border:1px solid var(--border);white-space:nowrap;
    }
    .pill.ongoing{background:var(--green-bg); border-color:var(--green-b); color:var(--green-t)}
    .pill.completed{background:#f1f5f4; border-color:var(--border); color:var(--muted)}
    .pill.winning{background:var(--green-bg); border-color:var(--green-b); color:var(--green-t)}
    .pill.outbid{background:var(--red-bg); border-color:var(--red-b); color:var(--red-t)}
    .pill.won{background:var(--green-bg); border-color:var(--green-b); color:var(--green-t)}
    .pill.lost{background:var(--red-bg); border-color:var(--red-b); color:var(--red-t)}

    /* Expand row */
    tr.expandRow td{padding:0;background:#fff;}
    .expandBox{
      border-top:1px solid var(--border);padding:12px;background:#fff;
      width:75%;max-width:75%;display:flex;flex-direction:column;gap:6px;margin:0 auto;
    }
    .expandHeader{display:flex;justify-content:space-between;align-items:center;gap:10px;}
    .expandHeader h3{margin:0;font-size:14px;font-weight:900;color:var(--text);}
    .innerTableWrap{border:1px solid var(--border);border-radius:12px;overflow:auto;background:#fff;width:100%;max-width:100%;margin:0 auto;}
    .innerTable{width:100%;border-collapse:collapse;font-size:13px;min-width:700px;}
    .innerTable thead{background:#f9fafb}
    .innerTable th,.innerTable td{padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;text-align:left;}
    .innerPager{width:100%;max-width:100%;display:flex;justify-content:flex-end;align-items:center;gap:10px;}
    .innerPager .pager-info{font-size:12px;color:var(--muted);font-weight:800;}
    @media (max-width:900px){
      .expandBox,.innerTableWrap,.innerPager{width:100%;max-width:100%;}
    }

    .empty{padding:28px 14px;text-align:center;color:var(--muted);font-weight:800;}

    /* Phone: each bid becomes a stacked card — the 1100px table otherwise hides
       status/result/actions behind horizontal scroll. Labels come from the fixed
       column order (Lot, Status, Result, Your Max, Highest, Ends, Time Left, actions). */
    @media (max-width:700px){
      table{min-width:0}
      thead{display:none}
      table,tbody,tbody tr{display:block;width:100%}
      tbody td[colspan]{display:block;text-align:center}
      tr.dataRow{padding:4px 0 10px;border-bottom:1px solid var(--border)}
      tr.dataRow td{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:none;padding:4px 12px;white-space:normal;text-align:left}
      tr.dataRow td::before{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:900;flex-shrink:0}
      tr.dataRow td:first-child{display:block;padding:12px 12px 8px}
      tr.dataRow td:nth-child(2)::before{content:"Status"}
      tr.dataRow td:nth-child(3)::before{content:"Result"}
      tr.dataRow td:nth-child(4)::before{content:"Your max bid"}
      tr.dataRow td:nth-child(5)::before{content:"Highest bid"}
      tr.dataRow td:nth-child(6)::before{content:"Ends"}
      tr.dataRow td:nth-child(7)::before{content:"Time left"}
      tr.dataRow td:last-child{justify-content:flex-end;gap:8px;padding-top:10px}
      .thumbCell{min-width:0}
      .lotTitle,.lotMeta{max-width:none;white-space:normal}
      tr.expandRow{display:block}
      tr.expandRow td{display:block;padding:0;border-bottom:none}
      .expandBox{width:100%;max-width:100%}
      .innerTable{min-width:520px} /* bid history stays a compact scrollable table */
    }

    @media print{
      .toolbar, .btn, .tabs, #topnavContainer {display:none !important;}
      body{background:#fff}
      .panel{box-shadow:none}
      .page{max-width:100%;padding:0}
      table{min-width:0}
    }
  </style>
</head>

<body>
  <!-- Shared Topnav -->
  <link rel="stylesheet" href="/css/topnav.css?v=3">
  <div id="topnavContainer"></div>
  <script>
    fetch("/topnav.html")
      .then(res => res.text())
      .then(html => { document.getElementById("topnavContainer").innerHTML = html; });
  </script>

  <script src="/js/config.js?v=3"></script>
  <script src="/js/auth.js?v=3" defer></script>

  <div class="page">
    <div class="hero">
      <div style="flex:1">
        <div class="heroHead">
          <div class="heroIcon"><i class="fa-solid fa-gavel"></i></div>
          <h1>My Bids</h1>
        </div>
        <div class="muted">Ongoing bids (Winning/Outbid), Won, and Lost — click a row to expand bid history.</div>

        <div class="toolbar">
          <input id="q" class="input" type="search" placeholder="Search by title, lot id, category…" />
          <button class="btn btn-primary" id="btnRefresh"><i class="fa-solid fa-rotate"></i> Refresh</button>
          <button class="btn" id="btnPrint"><i class="fa-solid fa-print"></i> Print</button>
        </div>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <span class="chip"><i class="fa-regular fa-circle-user"></i> <span id="chipUser">Guest</span></span>
        <span class="chip"><i class="fa-regular fa-clock"></i> <span id="pillNow">—</span></span>
      </div>
    </div>

    <div class="kpis">
      <div class="kpi blue">
        <div class="label"><i class="fa-solid fa-gavel"></i> Total bids</div>
        <div class="val" id="kpiTotal">—</div>
        <div class="hint">All lots you bid on</div>
      </div>
      <div class="kpi amber">
        <div class="label"><i class="fa-solid fa-bolt"></i> Ongoing</div>
        <div class="val" id="kpiOngoing">—</div>
        <div class="hint">Winning or outbid</div>
      </div>
      <div class="kpi green">
        <div class="label"><i class="fa-solid fa-trophy"></i> Won</div>
        <div class="val" id="kpiWon">—</div>
        <div class="hint">Auctions you won</div>
      </div>
      <div class="kpi red">
        <div class="label"><i class="fa-solid fa-xmark"></i> Lost</div>
        <div class="val" id="kpiLost">—</div>
        <div class="hint">Auctions you lost</div>
      </div>
    </div>

    <div class="tabs">
      <div class="tabButtons">
        <button class="tabBtn active" data-tab="ongoing">
          Ongoing Bids <span class="tabCount" id="countOngoing">0</span>
        </button>
        <button class="tabBtn" data-tab="won">
          Won <span class="tabCount" id="countWon">0</span>
        </button>
        <button class="tabBtn" data-tab="lost">
          Lost <span class="tabCount" id="countLost">0</span>
        </button>
      </div>
    </div>

    <div class="panel">
      <table>
        <thead>
          <tr>
            <th>Lot</th>
            <th>Status</th>
            <th>Result</th>
            <th>Your Max Bid</th>
            <th>Highest Bid</th>
            <th>Ends</th>
            <th>Time Left</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="8" class="empty"><i class="fa-solid fa-spinner fa-spin"></i> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const API_BASE_URL = CONFIG.API_BASE_URL;

    const token  = localStorage.getItem("token");
    const userId = localStorage.getItem("userid");
    const username = localStorage.getItem("username");

    const chipUser = document.getElementById("chipUser");
    const rowsEl = document.getElementById("rows");
    const qEl = document.getElementById("q");

    const countOngoing = document.getElementById("countOngoing");
    const countWon = document.getElementById("countWon");
    const countLost = document.getElementById("countLost");

    let activeTab = "ongoing";
    let RAW = [];

    const fmtMoney = (x) => {
      if (x == null) return '$—';
      const n = Number(x);
      return Number.isNaN(n) ? '$—' : `$${n.toLocaleString(undefined,{maximumFractionDigits:2})}`;
    };
    const fmtDateTime = (iso) => {
      if (!iso) return '—';
      try { return new Date(iso).toLocaleString(); } catch(e){ return iso; }
    };

    function setNow(){
      document.getElementById("pillNow").textContent = new Date().toLocaleString();
    }

    /* =====  Helper Pagination => Expand - Bid Table ====== */
    function initExpandBidPagination(expandRootEl, bids, rowsPerPage = 5) {

      const tbody    = expandRootEl.querySelector(".innerTbody");
      const prevBtn  = expandRootEl.querySelector(".pager-prev");
      const nextBtn  = expandRootEl.querySelector(".pager-next");
      const infoSpan = expandRootEl.querySelector(".pager-info");

      if (!tbody || !prevBtn || !nextBtn || !infoSpan) return;

      const sorted = (Array.isArray(bids) ? bids : [])
        .slice()
        .sort((a,b) => new Date(b.bidTime) - new Date(a.bidTime));

      const totalPages = Math.max(1, Math.ceil(sorted.length / rowsPerPage));
      let currentPage  = 1;

      function renderPage() {
        tbody.innerHTML = "";

        const start = (currentPage - 1) * rowsPerPage;
        const pageItems = sorted.slice(start, start + rowsPerPage);

        if (pageItems.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" style="padding:12px;color:var(--muted);font-weight:800;">No bids found.</td></tr>`;
        } else {
          pageItems.forEach(b => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${fmtMoney(b.bidAmount)}</td>
              <td>${b.userId ?? "—"}</td>
              <td>${b.username || "—"}</td>
              <td>${fmtDateTime(b.bidTime)}</td>
            `;
            tbody.appendChild(tr);
          });
        }

        infoSpan.textContent = `Page ${currentPage} of ${totalPages}`;
        prevBtn.disabled = (currentPage === 1);
        nextBtn.disabled = (currentPage === totalPages);
      }

      prevBtn.onclick = (e) => {
        e.stopPropagation();
        if (currentPage > 1) { currentPage--; renderPage(); }
      };
      nextBtn.onclick = (e) => {
        e.stopPropagation();
        if (currentPage < totalPages) { currentPage++; renderPage(); }
      };

      renderPage();
    }

    function timeLeftLabel(endIso){
      if(!endIso) return '—';
      const end = new Date(endIso).getTime();
      const now = Date.now();
      const diff = end - now;
      if (diff <= 0) return 'Ended';
      const d = Math.floor(diff/86400000);
      const h = Math.floor((diff%86400000)/3600000);
      const m = Math.floor((diff%3600000)/60000);
      const s = Math.floor((diff%60000)/1000);
      if (d>0) return `${d}d ${h}h ${m}m`;
      if (h>0) return `${h}h ${m}m ${s}s`;
      return `${m}m ${s}s`;
    }

    function isCompleted(product){
      const st = (product.status || "").toString().toUpperCase();
      if (st.includes("COMPLETED") || st.includes("ENDED")) return true;
      return timeLeftLabel(product.auctionEnd) === "Ended";
    }

    function getMyMaxBid(bids){
      if (!Array.isArray(bids)) return 0;
      return bids.reduce((max,b) => Math.max(max, Number(b.bidAmount || 0)), 0);
    }

    function isMineWinner(product){
      return (userId && product.wonUserId != null && String(product.wonUserId) === String(userId));
    }

    // For display result
    function getResult(product){
      const done = isCompleted(product);
      const mine = isMineWinner(product);
      if (done) return mine ? "WON" : "LOST";
      return mine ? "WINNING" : "OUTBID";
    }

    // For tab grouping
    function getTab(product){
      const done = isCompleted(product);
      if (!done) return "ongoing";
      return isMineWinner(product) ? "won" : "lost";
    }

    function pillStatus(product){
      const done = isCompleted(product);
      return done
        ? `<span class="pill completed"><i class="fa-solid fa-flag-checkered"></i> COMPLETED</span>`
        : `<span class="pill ongoing"><i class="fa-solid fa-bolt"></i> ONGOING</span>`;
    }

    function pillResult(product){
      const r = getResult(product);
      if (r === "WINNING") return `<span class="pill winning"><i class="fa-solid fa-trophy"></i> WINNING</span>`;
      if (r === "OUTBID")  return `<span class="pill outbid"><i class="fa-solid fa-triangle-exclamation"></i> OUTBID</span>`;
      if (r === "WON")     return `<span class="pill won"><i class="fa-solid fa-trophy"></i> WON</span>`;
      return `<span class="pill lost"><i class="fa-solid fa-xmark"></i> LOST</span>`;
    }

    // --- expand/collapse (only one open at a time) ---
    function closeAllExpands(){
      document.querySelectorAll("tr.expandRow").forEach(tr => tr.remove());
      document.querySelectorAll("tr.dataRow").forEach(tr => tr.dataset.open = "0");
    }

    function render(){
      const q = (qEl.value || "").trim().toLowerCase();

      const ongoing = RAW.filter(e => getTab(e.product) === "ongoing");
      const won = RAW.filter(e => getTab(e.product) === "won");
      const lost = RAW.filter(e => getTab(e.product) === "lost");

      countOngoing.textContent = ongoing.length;
      countWon.textContent = won.length;
      countLost.textContent = lost.length;

      document.getElementById("kpiTotal").textContent = RAW.length;
      document.getElementById("kpiOngoing").textContent = ongoing.length;
      document.getElementById("kpiWon").textContent = won.length;
      document.getElementById("kpiLost").textContent = lost.length;

      const list = (activeTab === "ongoing") ? ongoing : (activeTab === "won") ? won : lost;

      const filtered = list.filter(e => {
        if (!q) return true;
        const p = e.product || {};
        const hay = [
          p.title, p.id, p.categoryName,
          (p.category && p.category.name)
        ].filter(Boolean).join(" ").toLowerCase();
        return hay.includes(q);
      });

      closeAllExpands();

      if (filtered.length === 0){
        rowsEl.innerHTML = `<tr><td colspan="8" class="empty">No rows for this tab / search.</td></tr>`;
        return;
      }

      rowsEl.innerHTML = filtered.map((entry, idx) => {
        const p = entry.product || {};
        const bids = entry.bids || [];
        const myMax = getMyMaxBid(bids);
        const img = p.imageUrl || NO_IMAGE;
        const cat = (p.category && p.category.name) || p.categoryName || "—";
        const ends = fmtDateTime(p.auctionEnd);
        const left = timeLeftLabel(p.auctionEnd);

        const showPayButton = activeTab === "won" &&
                              entry.paymentRequired === true && entry.orderId != null;

        const payButton = showPayButton
          ? `
            <a class="btn btn-pay" href="/checkout.html?orderId=${entry.orderId}" onclick="event.stopPropagation()">
              <i class="fa-solid fa-credit-card"></i> Pay
            </a>
          `
          : "";

        return `
          <tr class="dataRow" data-index="${idx}" data-open="0">
            <td>
              <div class="thumbCell">
                <div class="thumb"><img src="${img}" alt="thumb"></div>
                <div class="lotText">
                  <div class="lotTitle" title="${(p.title||"").replace(/"/g,'&quot;')}">${p.title || "Untitled"}</div>
                  <div class="lotMeta">${cat} • Lot #${p.id ?? "—"}</div>
                </div>
              </div>
            </td>
            <td>${pillStatus(p)}</td>
            <td>${pillResult(p)}</td>
            <td><strong>${fmtMoney(myMax)}</strong></td>
            <td><strong>${fmtMoney(p.highestBid)}</strong></td>
            <td>${ends}</td>
            <td><strong>${left}</strong></td>
            <td>
              <a class="btn btn-primary" href="/product-view.html?id=${p.id}" onclick="event.stopPropagation()">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> View
              </a>
              ${payButton}
            </td>
          </tr>
        `;
      }).join("");

      // wire row clicks after paint
      document.querySelectorAll("tr.dataRow").forEach((tr) => {
        tr.addEventListener("click", () => {
          const idx = Number(tr.dataset.index);
          const entry = filtered[idx];
          toggleExpand(tr, entry);
        });
      });
    }

    function toggleExpand(rowTr, entry){
      const open = rowTr.dataset.open === "1";
      closeAllExpands();
      if (open) return;

      rowTr.dataset.open = "1";

      const p = entry.product || {};
      const bids = Array.isArray(entry.bids) ? entry.bids : [];

      const expandTr = document.createElement("tr");
      expandTr.className = "expandRow";
      expandTr.innerHTML = `
      <td colspan="8">
        <div class="expandBox">
          <div class="expandHeader">
            <h3><i class="fa-solid fa-list"></i> Bid History (Lot #${p.id ?? "—"})</h3>
            <button class="btn" type="button" id="collapseBtn">
              <i class="fa-solid fa-chevron-up"></i> Close
            </button>
          </div>

          <div class="innerTableWrap">
            <table class="innerTable">
              <thead>
                <tr>
                  <th>Bid Amount</th>
                  <th>User ID</th>
                  <th>User Name</th>
                  <th>Bid Time</th>
                </tr>
              </thead>
              <tbody class="innerTbody"></tbody>
            </table>
          </div>

          <div class="innerPager">
            <button class="btn btn-sm pager-prev" type="button">Prev</button>
            <span class="pager-info"></span>
            <button class="btn btn-sm pager-next" type="button">Next</button>
          </div>

        </div>
      </td>
    `;

      // insert right after clicked row
      rowTr.parentNode.insertBefore(expandTr, rowTr.nextSibling);

      // Wire collapse
      expandTr.querySelector("#collapseBtn")?.addEventListener("click", (e) => {
        e.stopPropagation();
        closeAllExpands();
      });

      // init pagination for this expanded bid table
      initExpandBidPagination(expandTr, bids, 5);
    }

    function wireTabs(){
      document.querySelectorAll(".tabBtn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".tabBtn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          activeTab = btn.dataset.tab;
          render();
        });
      });
    }

    async function load(){
      setNow();
      chipUser.textContent = username || "Guest";

      if (!token || !userId){
        rowsEl.innerHTML = `<tr><td colspan="8" class="empty">Please log in to view this page.</td></tr>`;
        if (typeof window.openLoginModal === "function") window.openLoginModal();
        return;
      }

      try{
        const res = await fetch(`${API_BASE_URL}/bids/my-bids/${userId}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!res.ok) throw new Error(await res.text());

        const data = await res.json();
        RAW = Array.isArray(data) ? data : [];
        render();

      }catch(e){
        console.error("Load failed:", e);
        rowsEl.innerHTML = `<tr><td colspan="8" class="empty">Failed to load. Check console.</td></tr>`;
      }
    }

    wireTabs();
    qEl.addEventListener("input", render);
    document.getElementById("btnRefresh").addEventListener("click", load);
    document.getElementById("btnPrint").addEventListener("click", () => window.print());
    load();
  </script>
</body>
</html>
