<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Buy Now — Liquidation Flips</title>
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- Buy Now is no longer a separate page — it's the Buy Now filter on the main
       listing (index.html). Redirect there, preserving any ?q= search term. -->
  <script>
    (function () {
      try {
        var p = new URLSearchParams(location.search);
        var q = p.get('q');
        var url = '/index.html?type=buynow' + (q ? '&q=' + encodeURIComponent(q) : '');
        location.replace(url);
      } catch (e) {
        location.replace('/index.html?type=buynow');
      }
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/index.html?type=buynow">
</head>
<body>
  <p style="font-family:system-ui,sans-serif;color:#6b7480;padding:24px;">
    Redirecting to <a href="/index.html?type=buynow">Buy Now deals</a>…
  </p>
</body>
</html>
